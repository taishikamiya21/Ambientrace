name: ambientrace
description: "Capture the ambient trace of your moments - not the photo, just the feeling."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Camera
  camera: ^0.11.1
  
  # Location / GPS
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  
  # Permissions
  permission_handler: ^12.0.0
  
  # Local Storage (using shared_preferences for simplicity initially)
  shared_preferences: ^2.5.0
  
  # Date/Time formatting
  intl: ^0.20.0
  
  # Image processing (for color palette extraction)
  palette_generator: ^0.3.3+4
  
  # UUID for unique IDs
  uuid: ^4.5.1
  
  # JSON serialization
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  # google_mlkit_image_labeling: ^0.14.1  # Temporarily disabled for simulator testing
  http: ^1.6.0
  image: ^4.5.3

  # Share functionality
  share_plus: ^10.1.4

  # Noise measurement
  noise_meter: ^5.1.0

  # Step count / pedometer
  pedometer: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
