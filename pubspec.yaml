name: ambientrace
description: "Capture the ambient trace of your moments - not the photo, just the feeling."
publish_to: 'none'

version: 1.2.0-alpha.1+3

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Camera
  camera: ^0.11.1
  
  # Location / GPS
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  
  # Permissions
  permission_handler: ^12.0.0
  
  # Local Storage (using shared_preferences for simplicity initially)
  shared_preferences: ^2.5.0
  
  # Date/Time formatting
  intl: ^0.20.0

  # UUID for unique IDs
  uuid: ^4.5.1
  
  # JSON serialization
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  google_mlkit_image_labeling: ^0.14.1
  http: ^1.6.0
  image: ^4.5.3

  # Share functionality
  share_plus: ^10.1.4

  # 画像をフォトライブラリへ保存
  gal: ^1.3.0

  # Noise measurement (iOS 26 非対応のため一時無効化 — audio_streamer の dyld 競合)
  # noise_meter: ^5.1.0

  # Step count / pedometer
  pedometer: ^4.0.2

  # App info (version, etc.)
  package_info_plus: ^8.0.0
  native_exif: ^0.7.0

  # v1.2: secure storage for API keys
  flutter_secure_storage: ^9.2.2

  # v1.2: file picking for import
  file_picker: ^8.1.4

  # v1.2: CSV export
  csv: ^6.0.0

  # v1.2: collection helpers (firstWhereOrNull)
  collection: ^1.18.0

  # v1.2 Phase B: ZIP packaging for card export
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Native Splash Screen Configuration
flutter_native_splash:
  color: "#0A0A0F"
  color_dark: "#0A0A0F"

  # Android 12+ specific settings
  android_12:
    color: "#0A0A0F"
    color_dark: "#0A0A0F"

  # iOS settings
  ios: true

  # Web settings (optional)
  web: false

# App Icon Configuration
# To generate icons: dart run flutter_launcher_icons
# Requires: assets/icon/app_icon.png (1024x1024)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/iconimage2.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon/iconimage2.png"
  min_sdk_android: 21
  remove_alpha_ios: true
